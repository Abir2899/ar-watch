<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة الساعة بالواقع المعزز</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #canvas3d { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 8px; text-align: center; }
    </style>
    <!-- مكتبات Three.js لعرض الساعة ثلاثية الأبعاد -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <!-- مكتبات MediaPipe الحديثة لتتبع اليد بدقة وثبات -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>
    <div id="loading">جاري تشغيل الكاميرا الخلفية وتحميل الساعة الحقيقية...</div>
    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas3d"></canvas>

    <script src="app.js"></script>
</body>
</html>
