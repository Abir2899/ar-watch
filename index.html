<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة الساعة ثلاثية الأبعاد</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 {
  padding: 15px;
}

#stage {
  position: relative;
  width: 95%;
  max-width: 900px;
  margin: auto;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

button {
  padding: 14px 25px;
  margin: 20px;
  border: none;
  border-radius: 10px;
  background: #c9a66b;
  font-size: 17px;
  cursor: pointer;
}

#status {
  color: #c9a66b;
  padding: 10px;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<h2>جربي ساعتك ثلاثية الأبعاد</h2>
<p id="status">اضغطي لتشغيل الكاميرا</p>
  <button id="start">تشغيل الكاميرا</button>
  <script>
document.getElementById("start").addEventListener("click", function() {
  alert("الزر يعمل بنجاح!");
});
</script>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

import {
  FilesetResolver,
  HandLandmarker
} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const button = document.getElementById("start");
const status = document.getElementById("status");

let renderer;
let scene;
let camera;
let watch;
let handTracker;
let busy = false;

button.addEventListener("click", startCamera);

async function startCamera() {

  if (busy) return;

  busy = true;
  button.disabled = true;
  status.textContent = "جاري تشغيل الكاميرا...";

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: "user" }
    });

    video.srcObject = stream;
    await video.play();

    const width = video.videoWidth;
    const height = video.videoHeight;
    const aspect = width / height;

    canvas.width = width;
    canvas.height = height;

    scene = new THREE.Scene();

    camera = new THREE.OrthographicCamera(
      -aspect, aspect, 1, -1, 0.1, 100
    );

    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true
    });

    renderer.setSize(width, height, false);

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    status.textContent = "جاري تحميل الساعة...";

    const loader = new GLTFLoader();

    watch = await new Promise((resolve, reject) => {
      loader.load(
        "./watch.glb",
        gltf => resolve(gltf.scene),
        undefined,
        error => reject(error)
      );
    });

    scene.add(watch);
    watch.visible = false;

    status.textContent = "جاري تشغيل تتبع اليد...";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    handTracker = await HandLandmarker.createFromOptions(
      vision,
      {
        baseOptions: {
          modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      }
    );

    status.textContent = "حركي يدك أمام الكاميرا!";

    button.style.display = "none";

    detectHand();

  } catch (error) {

    console.error(error);

    status.textContent = "حدث خطأ: " + error.message;

    button.disabled = false;
    busy = false;

  }
}

function detectHand() {

  if (!handTracker) return;

  const results = handTracker.detectForVideo(
    video,
    performance.now()
  );

  if (results.landmarks.length > 0) {

    const points = results.landmarks[0];

    const wrist = points[0];
    const index = points[5];
    const pinky = points[17];

    const x = 1 - wrist.x;
    const y = wrist.y;

    const aspect = video.videoWidth / video.videoHeight;

    const worldX = (x - 0.5) * 2 * aspect;
    const worldY = (0.5 - y) * 2;

    watch.position.set(worldX, worldY, 0);

    const distance = Math.hypot(
      index.x - pinky.x,
      index.y - pinky.y
    );

    watch.scale.setScalar(distance * 1.3);

    watch.rotation.z = Math.atan2(
      pinky.y - index.y,
      pinky.x - index.x
    );

    watch.visible = true;

  } else {

    watch.visible = false;

  }

  renderer.render(scene, camera);

  requestAnimationFrame(detectHand);
}

</script>
</body>
</html>
