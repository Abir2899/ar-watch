<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعراض الساعة بالواقع المعزز</title>
    <!-- استدعاء أداة جوجل الرسمية لعرض المجسمات والواقع المعزز -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ececec; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; }
        .ar-button { background-color: #007bff; border-radius: 4px; border: none; color: white; padding: 12px 24px; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; cursor: pointer; z-index: 999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- عرض الساعة ثلاثية الأبعاد مع خيار فتح الواقع المعزز AR -->
    <model-viewer 
        src="watch.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y" 
        autoplay 
        shadow-intensity="1" 
        alt="ساعة ثلاثية الأبعاد">
        
        <button slot="ar-button" class="ar-button">
            اضغط لتجربة الساعة على يدك ⌚
        </button>
        
    </model-viewer>

</body>
</html>
