<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة الساعة بالواقع المعزز</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas3d { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; }
    </style>
    <!-- استدعاء مكتبات تتبع اليد من جوجل وتنسور فلو -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <!-- استدعاء مكتبة Three.js لعرض مجسم الساعة -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div id="loading">جاري تشغيل الكاميرا وتحميل الساعة...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas3d"></canvas>

    <script src="app.js"></script>
</body>
</html>
